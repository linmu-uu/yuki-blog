<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#122a55"/>
			<stop offset="1" stop-color="#050b18"/>
		</linearGradient>
		<linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#7fbcff"/>
			<stop offset="0.5" stop-color="#e8f5ff"/>
			<stop offset="1" stop-color="#5fe1ff"/>
		</linearGradient>
		<radialGradient id="aura" cx="50%" cy="38%" r="60%">
			<stop offset="0" stop-color="#4aa8ff" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
		</radialGradient>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="2" result="blur"/>
			<feMerge>
				<feMergeNode in="blur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect width="64" height="64" rx="17" fill="url(#bg)"/>
	<rect width="64" height="64" rx="17" fill="url(#aura)"/>

	<!-- 光环 -->
	<g filter="url(#glow)">
		<ellipse cx="32" cy="23" rx="16" ry="5.2" fill="none" stroke="url(#halo)" stroke-width="2.6"/>
	</g>

	<!-- 四芒星 -->
	<path
		d="M32 31c.6 5.6 4.6 9.6 10.2 10.2C36.6 41.8 32.6 45.8 32 51.4c-.6-5.6-4.6-9.6-10.2-10.2C27.4 40.6 31.4 36.6 32 31Z"
		fill="#eaf5ff"/>
</svg>
